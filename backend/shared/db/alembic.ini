# Alembic configuration cho SocialCart shared DB
# Chạy từ root repository:
#   python -m alembic -c backend/shared/db/alembic.ini upgrade head
#
# KHÔNG chạy từ thư mục con; script_location dùng đường dẫn tương đối với file này.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../..

# DATABASE_URL được đọc từ env qua env.py; không ghi URL thật ở đây
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
