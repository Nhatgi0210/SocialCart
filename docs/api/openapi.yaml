openapi: 3.0.3
info:
  title: SocialCart Public API
  version: 1.0.0
  description: 'Design baseline 2026-10-19; no implementation yet. Source: PRD, Feature Spec, decisions.md
    and data-rules.md. UUID IDs, integer VND, UTC timestamps. Schemas cover public API; provider raw payload
    validation remains INT-01.'
servers:
- url: http://localhost:8000
  description: Local gateway after BOOT; paths include /api/v1.
security:
- BearerAuth: []
tags:
- name: System
- name: Auth
- name: Inbox
- name: Customers
- name: Products
- name: Orders
- name: Dashboard
- name: Platforms
- name: AI
- name: Webhooks
paths:
  /health:
    get:
      operationId: getHealth
      tags:
      - System
      summary: Service readiness
      x-task: BOOT-01
      x-requirements: []
      x-implementation-status: not-implemented
      security: []
      responses:
        '200':
          description: Contract response; not evidence of a running service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                service: api-gateway
                checked_at: '2026-10-19T07:00:00Z'
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
  /api/v1/auth/login:
    post:
      operationId: login
      tags:
      - Auth
      summary: Đăng nhập người bán
      x-task: AUTH-01
      x-requirements:
      - AC-29
      x-implementation-status: not-implemented
      description: Validate Origin allowlist. Sets HttpOnly refresh cookie; wrong email/password both
        return 401.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
            example:
              email: seller@example.test
              password: example-only-not-a-real-password
      responses:
        '200':
          description: Contract response; not evidence of a running service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                success: true
                data:
                  access_token: example-token-not-valid-for-authentication
                  token_type: bearer
                  expires_in: 900
                  user:
                    id: 550e8400-e29b-41d4-a716-000000000001
                    email: seller@example.test
                    name: Chủ shop demo
          headers:
            Set-Cookie:
              description: sc_refresh=<opaque>; HttpOnly; SameSite=Lax; Path=/api/v1/auth; Secure on HTTPS.
                Never returned in JSON.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '409':
          $ref: '#/components/responses/409'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /api/v1/auth/refresh:
    post:
      operationId: refresh
      tags:
      - Auth
      summary: Đổi refresh cookie lấy access token
      x-task: AUTH-01
      x-requirements:
      - AC-30
      - AC-32
      x-implementation-status: not-implemented
      description: Origin allowlist required. Atomic refresh rotation; max 7 days, idle 24h. Access token
        may be expired.
      security:
      - RefreshCookie: []
      responses:
        '200':
          description: Contract response; not evidence of a running service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                success: true
                data:
                  access_token: example-token-not-valid-for-authentication
                  token_type: bearer
                  expires_in: 900
                  user:
                    id: 550e8400-e29b-41d4-a716-000000000001
                    email: seller@example.test
                    name: Chủ shop demo
          headers:
            Set-Cookie:
              description: sc_refresh=<opaque>; HttpOnly; SameSite=Lax; Path=/api/v1/auth; Secure on HTTPS.
                Never returned in JSON.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
  /api/v1/auth/logout:
    post:
      operationId: logout
      tags:
      - Auth
      summary: Thu hồi phiên và đóng socket
      x-task: AUTH-01
      x-requirements:
      - AC-32
      x-implementation-status: not-implemented
      description: Origin allowlist; revoke sid and clear cookie. Already missing cookie returns 204 without
        revoking another session.
      security:
      - RefreshCookie: []
      responses:
        '204':
          description: Success; no response body.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: sc_refresh cleared with Max-Age=0 and matching cookie path.
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '409':
          $ref: '#/components/responses/409'
  /api/v1/auth/me:
    get:
      operationId: getMe
      tags:
      - Auth
      summary: Người bán hiện tại
      x-task: AUTH-01
      x-requirements:
      - AC-30
      - AC-31
      x-implementation-status: not-implemented
      responses:
        '200':
          description: Contract response; not evidence of a running service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              example:
                success: true
                data:
                  id: 550e8400-e29b-41d4-a716-000000000001
                  email: seller@example.test
                  name: Chủ shop demo
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /api/v1/conversations:
    get:
      operationId: listConversations
      tags:
      - Inbox
      summary: Danh sách hội thoại mới nhất trước
      x-task: INBOX-01
      x-requirements:
      - AC-04
      - AC-06
      x-implementation-status: not-implemented
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: platform
        in: query
        required: false
        schema:
          type: string
          enum:
          - FACEBOOK
          - ZALO
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - NEW
          - IN_PROGRESS
          - RESOLVED
      - name: ai_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - AI_HANDLING
          - NEEDS_SELLER
          - SELLER_HANDLING
      - name: customer_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          example: 550e8400-e29b-41d4-a716-000000000001
      responses:
        '200':
          description: Contract response; not evidence of a running service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
              example:
                success: true
                data:
                - id: 550e8400-e29b-41d4-a716-000000000020
                  platform: FACEBOOK
                  customer:
                    id: 550e8400-e29b-41d4-a716-000000000010
                    platform: FACEBOOK
                    platform_account_id: demo-page
                    platform_user_id: demo-user
                    name: Khách demo
                    created_at: '2026-10-19T07:00:00Z'
                  status: NEW
                  ai_status: AI_HANDLING
                  is_read: false
                  last_message_at: '2026-10-19T07:00:00Z'
                  last_message_preview: Shop có áo size M không?
                  version: 1
                  created_at: '2026-10-19T07:00:00Z'
                meta:
                  page: 1
                  limit: 20
                  total: 1
        '400':
          $ref: '#/components/responses/400'
        '422':
          $ref: '#/components/responses/422'
        '429':
          $ref: '#/components/responses/429'
        '503':
          $ref: '#/components/responses/503'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
  /api/v1/conversations/{id}:
    get:
