      x-task: SEND-01
      x-requirements:
      - AC-07
      x-implementation-status: not-implemented
      description: 'Server sets sender=SELLER, status=SENDING; only provider acceptance changes to SENT.
        Seller reply takes over: sets SELLER_HANDLING and increments ai_generation atomically before dispatch.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 550e8400-e29b-41d4-a716-000000000001
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageCreate'
            example:
              content: Shop đã nhận thông tin của bạn.
      responses:
        '202':
          description: Contract response; not evidence of a running service.
          content:
            application/json:
              schema:
