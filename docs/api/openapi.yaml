      - AC-02
      x-implementation-status: not-implemented
      description: 'Public callback: state one-time/expiring and bound to authenticated initiating session;
        code required unless provider returns error. No access bearer required. Do not return provider
        tokens.'
      parameters:
      - name: platform
        in: path
        required: true
        schema:
          type: string
          enum:
          - facebook
          - zalo
      - name: state
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          pattern: .*\S.*
          maxLength: 500
      - name: code
        in: query
        required: false
        schema:
